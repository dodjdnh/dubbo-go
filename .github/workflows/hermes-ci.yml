name: Hermes personal CI
run-name: "Hermes ${{ inputs.branch }} @ ${{ inputs.sha }} [${{ inputs.request }}]"
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Trusted personal Fork branch
        required: true
        type: string
      sha:
        description: Immutable full commit SHA from that branch
        required: true
        type: string
      request:
        description: Windows controller request ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    if: github.repository == 'dodjdnh/dubbo-go' && github.actor == 'dodjdnh' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, hermes-ci, 'hermes-${{ github.run_id }}-${{ github.run_attempt }}']
    timeout-minutes: 180
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate dispatch
        env:
          TEST_SHA: ${{ inputs.sha }}
          TEST_BRANCH: ${{ inputs.branch }}
        run: |
          [[ "$TEST_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TEST_BRANCH" =~ ^(main|develop|(feat|fix|feature|test|docs|refactor|chore)/[a-zA-Z0-9._/-]+)$ ]]
      - name: Checkout exact tested SHA
        env:
          TEST_SHA: ${{ inputs.sha }}
        run: |
          git clone --no-checkout /opt/source.bundle .
          git checkout --detach "$TEST_SHA"
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
      - name: Record source identity
        env:
          TEST_SHA: ${{ inputs.sha }}
          TEST_BRANCH: ${{ inputs.branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          printf '### Tested source\nRepository: %s\n\nBranch: %s\n\nSHA: `%s`\n\nRunner: `%s`\n' "$GITHUB_REPOSITORY" "$TEST_BRANCH" "$TEST_SHA" "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: License
        id: license
        timeout-minutes: 10
        continue-on-error: true
        uses: apache/skywalking-eyes/header@5c28835454eb069b7a4667430f2c40a3d5a9912c
        with:
          config: .licenserc.yaml
          mode: check
          token: ''
      - name: Setup project Go
        id: go
        timeout-minutes: 15
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Setup Java 8 for ZooKeeper unit tests
        id: java
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Prepare ZooKeeper test dependency
        id: zk
        continue-on-error: true
        run: |
          go mod download github.com/dubbogo/gost
          gost_dir="$(go list -m -f '{{.Dir}}' github.com/dubbogo/gost)"
          jar_path="$(find "$gost_dir/database/kv/zk" -type f -path '*/contrib/fatjar/zookeeper-*-fatjar.jar' -print -quit)"
          test -n "$jar_path" && test -f "$jar_path"
          java -version
          echo "ZOOKEEPER_PATH=${jar_path%/contrib/fatjar/*}" >> "$GITHUB_ENV"
      - name: Format (clean source worktree)
        id: format
        timeout-minutes: 30
        continue-on-error: true
        run: |
          git worktree add --detach "$RUNNER_TEMP/format" HEAD
          cd "$RUNNER_TEMP/format"
          make fmt
          git diff --exit-code -- '*.go'
      - name: Lint
        id: lint
        timeout-minutes: 30
        continue-on-error: true
        run: make lint
      - name: Unit Test
        id: unit
        timeout-minutes: 45
        if: ${{ !cancelled() && steps.go.outcome == 'success' && steps.java.outcome == 'success' && steps.zk.outcome == 'success' }}
        continue-on-error: true
        run: |
          make test
          cp coverage.txt "$RUNNER_TEMP/coverage-unit.txt"
      - name: Race Test
        id: race
        timeout-minutes: 60
        if: ${{ !cancelled() && steps.go.outcome == 'success' && steps.java.outcome == 'success' && steps.zk.outcome == 'success' }}
        continue-on-error: true
        env:
          GOFLAGS: -p=1
        run: |
          make test-race
          cp coverage.txt "$RUNNER_TEMP/coverage-race.txt"
      - name: Setup OpenAPI module Go
        id: openapi_go
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: tools/protoc-gen-triple-openapi/go.mod
          cache: false
      - name: OpenAPI Tests
        id: openapi
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.openapi_go.outcome == 'success' }}
        continue-on-error: true
        working-directory: tools/protoc-gen-triple-openapi
        run: go test ./... -count=1
      - name: Preserve coverage on Hermes
        id: coverage
        if: ${{ !cancelled() && steps.unit.outcome == 'success' && steps.race.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, time
          root = pathlib.Path('/home/runner/cache/reports')
          root.mkdir(exist_ok=True)
          dest = root / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          dest.mkdir(exist_ok=True)
          files = {}
          for name in ('coverage-unit.txt', 'coverage-race.txt'):
              src = pathlib.Path(os.environ['RUNNER_TEMP']) / name
              assert src.is_file() and src.stat().st_size > 0, name
              shutil.copyfile(src, dest / name)
              files[name] = hashlib.sha256(src.read_bytes()).hexdigest()
          (dest / 'manifest.json').write_text(json.dumps({'sha': os.environ['TEST_SHA'], 'url': os.environ['RUN_URL'], 'files': files}, indent=2))
          for i, p in enumerate(sorted(root.iterdir(), key=lambda p: p.stat().st_mtime, reverse=True)):
              if p.is_dir() and not p.is_symlink() and (i >= 20 or p.stat().st_mtime < time.time() - 14*86400):
                  shutil.rmtree(p)
          print('Coverage saved on Hermes:', dest.name, json.dumps(files))
          PY
        env:
          TEST_SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Coverage artifacts (optional GitHub mirror)
        id: upload
        continue-on-error: true
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ inputs.sha }}
          path: |
            ${{ runner.temp }}/coverage-*.txt
            coverage.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Report and enforce every required check
        if: ${{ always() }}
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ['RESULTS'])
          required = ['license', 'go', 'java', 'zk', 'format', 'lint', 'unit', 'race', 'openapi_go', 'openapi', 'coverage']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n| Check | Outcome |\n|---|---|\n')
              for k in required:
                  f.write(f"| {k} | {s.get(k, {}).get('outcome', 'not run')} |\n")
              f.write(f"| optional GitHub artifact mirror | {s.get('upload', {}).get('outcome', 'not run')} |\n")
              f.write('\nCoverage is retained on Hermes (latest 20 runs, up to 14 days, subject to CI cache budget). GitHub mirror failure is a reporting limitation, not a test pass.\n')
              f.write('\nIntegration, generated CLI projects and RISC-V: outside phase 1. Codecov upload: not configured.\n')
          raise SystemExit(any(s.get(k, {}).get('outcome') != 'success' for k in required))
          PY
